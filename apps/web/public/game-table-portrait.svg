<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 1000" width="100%" height="100%" style="max-width: 100%; height: auto; display: block; margin: auto;">
  <defs>
    <!-- Outer Rail / Wood Bevel Gradient -->
    <radialGradient id="railWoodPortrait" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2a150c"/>
      <stop offset="70%" stop-color="#140804"/>
      <stop offset="100%" stop-color="#080301"/>
    </radialGradient>

    <!-- Leather Padded Armrest Gradient -->
    <linearGradient id="leatherArmrestPortrait" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d2314"/>
      <stop offset="25%" stop-color="#2a160b"/>
      <stop offset="75%" stop-color="#190c06"/>
      <stop offset="100%" stop-color="#0f0703"/>
    </linearGradient>

    <!-- Green Felt Depth Gradient -->
    <radialGradient id="greenFeltPortrait" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e7e44"/>
      <stop offset="55%" stop-color="#145a32"/>
      <stop offset="85%" stop-color="#0f4426"/>
      <stop offset="100%" stop-color="#0a301a"/>
    </radialGradient>

    <!-- Brass Cup Holder Gradient -->
    <radialGradient id="brassCupPortrait" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Realistic Drop Shadows -->
    <filter id="tableShadowPortrait" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="railInnerGlowPortrait" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Table Drop Shadow & Hardwood Outer Edge -->
  <g filter="url(#tableShadowPortrait)">
    <rect x="55" y="80" width="540" height="840" rx="270" fill="url(#railWoodPortrait)"/>
  </g>

  <!-- Padded Leather Armrest -->
  <rect x="69" y="94" width="512" height="812" rx="256" fill="url(#leatherArmrestPortrait)" stroke="#452311" stroke-width="3"/>
  <rect x="85" y="110" width="480" height="780" rx="240" fill="none" stroke="#120803" stroke-width="2" opacity="0.8"/>

  <!-- Inner Wooden Bevel Inset -->
  <rect x="99" y="124" width="452" height="752" rx="226" fill="#1f1008" filter="url(#railInnerGlowPortrait)"/>

  <!-- Green Poker Felt Playing Surface -->
  <rect x="111" y="136" width="428" height="728" rx="214" fill="url(#greenFeltPortrait)" stroke="#062111" stroke-width="2"/>

  <!-- Traditional Golden Inlaid Betting Lines -->
  <rect x="141" y="166" width="368" height="668" rx="184" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-dasharray="14 7" opacity="0.45"/>
  <rect x="149" y="174" width="352" height="652" rx="176" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.25"/>

  <!-- Brass Cup Holders -->
  <!-- Left Rail -->
  <circle cx="85" cy="340" r="16" fill="url(#brassCupPortrait)"/>
  <circle cx="85" cy="340" r="12" fill="#171717"/>
  <circle cx="80" cy="500" r="16" fill="url(#brassCupPortrait)"/>
  <circle cx="80" cy="500" r="12" fill="#171717"/>
  <circle cx="85" cy="660" r="16" fill="url(#brassCupPortrait)"/>
  <circle cx="85" cy="660" r="12" fill="#171717"/>

  <!-- Right Rail -->
  <circle cx="565" cy="340" r="16" fill="url(#brassCupPortrait)"/>
  <circle cx="565" cy="340" r="12" fill="#171717"/>
  <circle cx="570" cy="500" r="16" fill="url(#brassCupPortrait)"/>
  <circle cx="570" cy="500" r="12" fill="#171717"/>
  <circle cx="565" cy="660" r="16" fill="url(#brassCupPortrait)"/>
  <circle cx="565" cy="660" r="12" fill="#171717"/>

  <!-- Top & Bottom Flanks -->
  <circle cx="325" cy="112" r="16" fill="url(#brassCupPortrait)"/>
  <circle cx="325" cy="112" r="12" fill="#171717"/>
  <circle cx="325" cy="888" r="16" fill="url(#brassCupPortrait)"/>
  <circle cx="325" cy="888" r="12" fill="#171717"/>
</svg>
